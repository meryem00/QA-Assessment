name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20        # same version as the Dockerfile (node:20-alpine)
          cache: npm              # reuses downloaded packages → faster runs

      - name: Install dependencies
        run: npm ci               # installs EXACTLY what package-lock.json says, fails if out of sync

      - name: Lint
        run: npm run lint:check   # no --fix: CI must report problems, not silently fix them

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
